services:
  # API Service (Free Tier compatible)
  - type: web
    name: naija-translator-api
    plan: free # Explicitly use the free tier to avoid payment info requests
    env: python
    # For Free Tier, we use 'plan: free' explicitly if needed, but usually the UI handles it.
    # We remove the Worker and Redis as they are paid on Render unless using external free providers.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11" # Pin to a stable version to avoid Python 3.14 build issues
      - key: AUDIO_BACKEND
        value: supabase
      - key: USE_REAL_MODELS
        value: "true"
      - key: REQUIRE_API_KEY
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: USE_REDIS_JOBS
        value: "false" # Redis is not free on Render
