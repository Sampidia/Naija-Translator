services:
  # API Service
  - type: web
    name: naija-translator-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AUDIO_BACKEND
        value: supabase
      - key: USE_REAL_MODELS
        value: "true"
      - key: REQUIRE_API_KEY
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: PORT
        value: 10000

