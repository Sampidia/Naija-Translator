<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naija Translator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin: 0.5rem 0 0.25rem;
      font-weight: 600;
    }

    input,
    textarea,
    select,
    button {
      width: 100%;
      padding: 0.6rem;
      margin-bottom: 0.6rem;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .muted {
      color: #555;
      font-size: 0.9rem;
    }

    audio {
      width: 100%;
      margin-top: 0.5rem;
    }

    .rec-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      align-items: end;
    }

    #recordBtn {
      background: #d32f2f;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    #recordBtn.recording {
      background: #b71c1c;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.6;
      }
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .btn-group button {
      margin-bottom: 0;
      flex: 1;
    }

    .btn-outline {
      background: #fff;
      color: #333;
      border: 1px solid #ccc;
    }

    .btn-outline:hover {
      background: #f0f0f0;
    }
  </style>
</head>

<body>
  <h1>Naija Translator UI (MVP)</h1>
  <p class="muted">This frontend uses existing FastAPI endpoints for translation, TTS, and speech translation.</p>

  <div class="card" style="background: #f9f9f9;">
    <label for="apiKey">API Key (if REQUIRE_API_KEY=true)</label>
    <input id="apiKey" type="password" placeholder="Enter API Key..." />
  </div>

  <section class="card">
    <h2>1) Text Translation</h2>
    <label for="translateText">Text</label>
    <textarea id="translateText" rows="3" placeholder="Type text..."></textarea>
    <div class="row">
      <div>
        <label for="sourceLang">Source</label>
        <select id="sourceLang">
          <option value="en">English</option>
          <option value="yo">Yoruba</option>
        </select>
      </div>
      <div>
        <label for="targetLang">Target</label>
        <select id="targetLang">
          <option value="yo" selected>Yoruba</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
    <button id="translateBtn">Translate</button>
    <p id="translateStatus" class="muted"></p>
    <label>Translated output</label>
    <textarea id="translatedOut" rows="3" readonly></textarea>
    <div id="translateAudioGroup" style="display:none;">
      <div class="btn-group">
        <button id="listenBtn" class="btn-outline">🔊 Listen</button>
        <a id="downloadTranslateLink" class="btn-outline"
          style="text-decoration:none; display:flex; align-items:center; justify-content:center; border-radius:3px; font-size: 0.8rem; height: 36px;"
          download>💾 Download</a>
      </div>
      <audio id="translateOutAudio" controls style="margin-top:0.5rem;"></audio>
    </div>
  </section>

  <section class="card">
    <h2>2) Text to Speech (play + download)</h2>
    <label for="ttsText">Text</label>
    <textarea id="ttsText" rows="3" placeholder="Type text for speech..."></textarea>
    <label for="ttsLang">Language</label>
    <select id="ttsLang">
      <option value="en">English</option>
      <option value="yo">Yoruba</option>
    </select>
    <button id="ttsBtn">Generate Audio</button>
    <p id="ttsStatus" class="muted"></p>
    <audio id="ttsAudio" controls></audio>
    <p><a id="downloadLink" href="#" download style="display:none;">Download generated audio</a></p>
  </section>

  <section class="card">
    <h2>3) Yoruba Speech → English + Audio</h2>

    <label>Option A: Record from microphone</label>
    <div class="rec-row">
      <div>
        <button id="recordBtn">🎙 Start Recording</button>
      </div>
      <div>
        <p class="muted" id="recordStatus">Not recording</p>
      </div>
    </div>
    <audio id="recordedPreview" controls style="display:none;"></audio>

    <label>Option B: Upload audio file</label>
    <input id="speechFile" type="file" accept="audio/*" />

    <button id="speechBtn">Translate Speech</button>
    <p class="muted" id="speechTextOut"></p>
    <p id="speechTtsStatus" class="muted"></p>
    <audio id="speechAudio" controls></audio>
  </section>

  <script>
    function getApiKey() {
      return document.getElementById('apiKey').value;
    }

    async function fetchJson(url, options = {}) {
      const headers = options.headers || {};
      const apiKey = getApiKey();
      if (apiKey) {
        headers['x-api-key'] = apiKey;
      }

      const res = await fetch(url, { ...options, headers });
      if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
      return res.json();
    }

    async function waitForAudio(jobId, statusEl) {
      for (let i = 0; i < 120; i++) {
        const status = await fetchJson(`/api/v1/tts/${jobId}`);
        statusEl.textContent = `Job status: ${status.status}`;
        if (status.status === 'ready') return status;
        await new Promise(r => setTimeout(r, 500));
      }
      throw new Error('Timeout waiting for TTS job to complete');
    }

    document.getElementById('translateBtn').onclick = async () => {
      const text = document.getElementById('translateText').value;
      const source_lang = document.getElementById('sourceLang').value;
      const target_lang = document.getElementById('targetLang').value;
      const out = document.getElementById('translatedOut');
      const statusEl = document.getElementById('translateStatus');

      if (source_lang === target_lang) {
        statusEl.textContent = 'Error: Source and Target languages must be different.';
        out.value = '';
        return;
      }

      out.value = 'Translating...';
      statusEl.textContent = `Sending: ${source_lang} -> ${target_lang}...`;
      try {
        const data = await fetchJson('/api/v1/translate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, source_lang, target_lang })
        });
        out.value = data.translated_text;
        statusEl.textContent = `Model used: ${data.model} (${source_lang} -> ${target_lang})`;
        // Show audio controls
        document.getElementById('translateAudioGroup').style.display = 'block';
      } catch (e) {
        out.value = `Error: ${e.message}`;
        statusEl.textContent = 'Translation failed';
        document.getElementById('translateAudioGroup').style.display = 'none';
      }
    };

    document.getElementById('listenBtn').onclick = async () => {
      const text = document.getElementById('translatedOut').value;
      const lang = document.getElementById('targetLang').value;
      const statusEl = document.getElementById('translateStatus');
      const audioEl = document.getElementById('translateOutAudio');
      const download = document.getElementById('downloadTranslateLink');

      if (!text) return;

      statusEl.textContent = 'Generating speech...';
      try {
        const job = await fetchJson('/api/v1/tts', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, lang, voice: 'default' })
        });
        const ready = await waitForAudio(job.job_id, statusEl);
        audioEl.src = ready.play_url;
        download.href = ready.download_url;
        statusEl.textContent = 'Speech ready.';
      } catch (e) {
        statusEl.textContent = `Speech error: ${e.message}`;
      }
    };

    document.getElementById('ttsBtn').onclick = async () => {
      const text = document.getElementById('ttsText').value;
      const lang = document.getElementById('ttsLang').value;
      const statusEl = document.getElementById('ttsStatus');
      const audioEl = document.getElementById('ttsAudio');
      const download = document.getElementById('downloadLink');
      statusEl.textContent = 'Submitting job...';
      try {
        const job = await fetchJson('/api/v1/tts', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, lang, voice: 'default' })
        });
        const ready = await waitForAudio(job.job_id, statusEl);
        audioEl.src = ready.play_url;
        download.href = ready.download_url;
        download.style.display = 'inline';
      } catch (e) {
        statusEl.textContent = `Error: ${e.message}`;
      }
    };

    // ---------- Microphone Recording ---------- //
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordedBlob = null;

    document.getElementById('recordBtn').onclick = async () => {
      const btn = document.getElementById('recordBtn');
      const statusEl = document.getElementById('recordStatus');
      const preview = document.getElementById('recordedPreview');

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        // Stop recording
        mediaRecorder.stop();
        btn.textContent = '🎙 Start Recording';
        btn.classList.remove('recording');
        statusEl.textContent = 'Processing...';
        return;
      }

      // Start recording
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        recordedChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          recordedBlob = new Blob(recordedChunks, { type: 'audio/webm' });
          const url = URL.createObjectURL(recordedBlob);
          preview.src = url;
          preview.style.display = 'block';
          statusEl.textContent = 'Recording saved! Click "Translate Speech" to process.';
          // Stop all tracks to release microphone
          stream.getTracks().forEach(t => t.stop());
        };

        mediaRecorder.start();
        btn.textContent = '⏹ Stop Recording';
        btn.classList.add('recording');
        statusEl.textContent = 'Recording... Speak now!';
      } catch (e) {
        statusEl.textContent = `Microphone error: ${e.message}`;
      }
    };

    // ---------- Speech Translate (record OR upload) ---------- //
    document.getElementById('speechBtn').onclick = async () => {
      const file = document.getElementById('speechFile').files[0];
      const out = document.getElementById('speechTextOut');
      const statusEl = document.getElementById('speechTtsStatus');
      const audioEl = document.getElementById('speechAudio');

      // Prefer file upload if selected, otherwise use recorded audio
      let audioData = file || recordedBlob;
      if (!audioData) {
        out.textContent = 'Please record audio or select a file first.';
        return;
      }

      out.textContent = 'Uploading & translating...';
      const form = new FormData();
      form.append('audio_file', audioData, audioData.name || 'recording.webm');
      try {
        const data = await fetchJson('/api/v1/speech/translate', { method: 'POST', body: form });
        out.textContent = `Transcript: ${data.transcript_yo} | EN: ${data.translated_text_en}`;
        const ready = await waitForAudio(data.tts_job_id, statusEl);
        audioEl.src = ready.play_url;
      } catch (e) {
        out.textContent = `Error: ${e.message}`;
      }
    };
  </script>
</body>

</html>
